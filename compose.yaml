name: guanying-catalog
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-catalog_local}
    ports:
      - "127.0.0.1:${PG_PORT:-25432}:5432"
    volumes:
      - catalog_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 2s
      timeout: 3s
      retries: 40
  api:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
      args:
        PYTHON_IMAGE: ${WORKBENCH_PYTHON_IMAGE:-python:3.12-slim}
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: catalog
      PGUSER: catalog
      PGPASSWORD: ${POSTGRES_PASSWORD:-catalog_local}
      ADMIN_BOOTSTRAP_PASSWORD_HASH: ${ADMIN_BOOTSTRAP_PASSWORD_HASH:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
      DEMO_DATA: ${DEMO_DATA:-1}
      ENABLE_SIMULATOR: ${ENABLE_SIMULATOR:-1}
      AUTO_ASSIGN: ${AUTO_ASSIGN:-0}
      MEDIACRAWLER_URL: ${MEDIACRAWLER_URL:-}
      MEDIACRAWLER_OWN_POSTS: ${MEDIACRAWLER_OWN_POSTS:-}
      EXA_API_KEY: ${KOOYING_EXA_API_KEY:-${EXA_API_KEY:-}}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      SALES_LLM_BASE_URL: ${SALES_LLM_BASE_URL:-}
      SALES_LLM_MODEL: ${SALES_LLM_MODEL:-}
      SALES_LLM_API_KEY: ${SALES_LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:-}
      META_PAGE_ID: ${META_PAGE_ID:-}
      META_PAGE_TOKEN: ${META_PAGE_TOKEN:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-}
      WA_APP_SECRET: ${WA_APP_SECRET:-}
      WA_VERIFY_TOKEN: ${WA_VERIFY_TOKEN:-}
      WA_PHONE_NUMBER_IDS: ${WA_PHONE_NUMBER_IDS:-}
      IG_APP_SECRET: ${IG_APP_SECRET:-}
      IG_VERIFY_TOKEN: ${IG_VERIFY_TOKEN:-}
      IG_ACCOUNT_IDS: ${IG_ACCOUNT_IDS:-}
      X_CLIENT_SECRET: ${X_CLIENT_SECRET:-}
      X_USER_IDS: ${X_USER_IDS:-}
      TIKTOK_APP_SECRET: ${TIKTOK_APP_SECRET:-}
      TIKTOK_BUSINESS_IDS: ${TIKTOK_BUSINESS_IDS:-}
      TELEGRAM_BOT_ID: ${TELEGRAM_BOT_ID:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      LINE_BOT_USER_ID: ${LINE_BOT_USER_ID:-}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-}
      WX_TOKEN: ${WX_TOKEN:-}
      WX_AES_KEY: ${WX_AES_KEY:-}
      WX_CORP_ID: ${WX_CORP_ID:-}
      WX_KF_SECRET: ${WX_KF_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./docs:/app/docs
      - ./鼓式刹车片照片等8个文件:/app/鼓式刹车片照片等8个文件:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
  web:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
      args:
        NODE_IMAGE: ${WORKBENCH_NODE_IMAGE:-node:24-alpine}
        NGINX_IMAGE: ${WORKBENCH_NGINX_IMAGE:-nginx:stable-alpine}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
volumes:
  catalog_pg:

[project]
name = "guanying-sales"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi==0.136.1",
  "uvicorn[standard]==0.46.0",
  "httpx==0.27.2",
  "cryptography==49.0.0",
  "psycopg[binary]>=3.2,<4",
  "langchain-openai>=1,<2",
  "openpyxl>=3.1,<4",
  "python-dotenv>=1,<2",
  "pillow>=13.0.0",
]

[dependency-groups]
dev = ["pytest>=8,<10", "playwright>=1.50,<2"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

